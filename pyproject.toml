[project]
name = "learningfast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nelbio", email = "167593673+nelbio@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.10.0",
    "python-dotenv>=1.2.1",
    "requests>=2.33.0",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
learningfast = "learningfast:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff.lint]
ignore = ["B008", "ASYNC230", "BLE001"]  # Depends() FastAPI, lecture de fichier bloquante pour upload ImageKit, except Exception global
